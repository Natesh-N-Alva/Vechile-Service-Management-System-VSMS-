<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Vehicle Service Management System</h1>
    </header>

    <main>
        <section class="card">
            <h2>Add New Vehicle</h2>
            <form id="addVehicleForm">
                <div class="form-group">
                    <label for="vehicleId">Vehicle ID:</label>
                    <input type="number" id="vehicleId" required>
                </div>

                <div class="form-group">
                    <label for="userId">Owner (User ID):</label>
                    <input type="number" id="userId" required>
                </div>

                <div class="form-group">
                    <label for="regNumber">Registration Number:</label>
                    <input type="text" id="regNumber" required>
                </div>

                <div class="form-group">
                    <label for="brand">Brand:</label>
                    <input type="text" id="brand" required>
                </div>

                <div class="form-group">
                    <label for="model">Model:</label>
                    <input type="text" id="model" required>
                </div>

                <div class="form-group">
                    <label for="purchaseDate">Purchase Date:</label>
                    <input type="date" id="purchaseDate" required>
                </div>

                <div class="form-group">
                    <label for="fuelType">Fuel Type:</label>
                    <select id="fuelType" required>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="EV">Electric</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>
                </div>

                <button type="submit">Add Vehicle</button>
            </form>
            <p id="formMessage"></p>
        </section>

        <section class="card">
            <h2>Registered Users</h2>
            <button id="loadUsersBtn">Load Users</button>
            <ul id="userList">
                </ul>
        </section>
    </main>

    <script src="{{ url_for('static', filename='globals.css') }}"></script>
</body>
</html>
